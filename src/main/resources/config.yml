# จำนวนคนสูงสุดต่อทีมในเมนูเลือกทีม
max-team-size: 5

# แจกไอเทมเลือกทีม (ขนแกะขาว) ให้คนที่อยู่ในล็อบบี้อัตโนมัติ
auto-give-selector: true

revive:
  # เลือดที่คนถูกชุบได้รับ (4.0 = 2 หัวใจ) ใช้ทั้งชุบตอนล้มและชุบด้วยหัว
  health: 4.0
  # ชุบคนที่ "ล้ม" (ยังไม่ตายจริง) ใช้เวลากี่วินาที (คลิกขวาตัวเขาเฉย ๆ)
  channel-seconds: 4
  # ชุบคนที่ "ตายจริงแล้ว" ด้วยการถือหัวเขาแล้วคลิกขวาค้าง ใช้เวลานานกว่า (ไม่ต้องมีแท่นแล้ว)
  head-channel-seconds: 10

mob-nerf:
  # ดาเมจลูกศรที่มอนสเตอร์ยิงใส่ผู้เล่น (0.08 = เหลือ 8% ของปกติ)
  ranged-multiplier: 0.08
  # ดาเมจระเบิดของ Creeper ตอนอยู่ใกล้ ๆ (0.1 = เหลือ 10% ของปกติ)
  explosion-multiplier: 0.1

ore-boost:
  # เพิ่มแร่ในชังก์ที่ "สร้างใหม่" ของโอเวอร์เวิลด์ (ชังก์เก่าไม่เปลี่ยน)
  enabled: true
  # 1.0 = ค่าเริ่มต้น, 2.0 = เพิ่มเป็นสองเท่า, 0.5 = ครึ่งหนึ่ง
  multiplier: 1.0

downed:
  # ล้มกี่วินาทีก่อนตายจริง ถ้าไม่มีเพื่อนมาชุบ
  seconds: 30
  # ความช้าตอนล้ม (Slowness level, 0=เดินปกติ, สูงขึ้น=ช้าลง) ตั้งต่ำไว้ให้คลานได้นิดหน่อย ไม่แข็งทื่อ
  slowness-level: 4

vote:
  # เปิด/ปิดระบบโหวต debuff ทีม
  enabled: true
  # จังหวะเริ่มโหวตตั้งไว้ในโค้ด (GameTimer.java) ที่นาทีที่ 77 ของเวลาจริง (ก่อนกำแพงแนวดิ่ง/วงสุดท้าย 3 นาที)
  # ไม่ใช้ tick ของดาต้าแพ็กแล้ว เพื่อกัน tick rate ทำให้จังหวะเพี้ยนเหมือนที่เจอกับบอร์ดเดอร์
